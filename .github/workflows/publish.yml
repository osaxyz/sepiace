# npm create sepiace の CLI（cli/、npm の create-sepiace）を npm に公開する。osaxyz/nyquist の publish.yml と同じ作り。
# npm の Trusted Publishing（OIDC）で認証するので、npm のトークンを GitHub に置かない。
# リポジトリが公開されているので、どのコミットからビルドしたかを示す provenance も付ける。
# 依存のインストールとビルドは、公開の証明書を取り出せないジョブで行い、tarball だけを公開のジョブに渡す。
# 依存のどれかが乗っ取られても、公開の証明書を使って偽のパッケージを出せないようにする。
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # main 以外のブランチから、確かめていないコードを公開させない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # npm の Trusted Publishing の設定で、この environment 名を指定する。
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # このジョブではリポジトリのコードも依存も動かさない。受け取った tarball を npm に渡すだけにする。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: package
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing には npm 11.5.1 以上が要る。公開に使う CLI なので版を固定する。
      - run: npm install -g npm@11.19.0
      - name: npm publish
        working-directory: package
        run: npm publish ./*.tgz --access public --provenance
